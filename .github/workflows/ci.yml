name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Non-bloquant pour l'instant : 6 erreurs préexistantes (règles React Compiler
      # sur ThemeToggle/Navbar/UnreadBadge/PriceSuggestion/ListingCard) restent à corriger
      # séparément, avec une revue dédiée du comportement de ces composants.
      - run: npm run lint
        continue-on-error: true

      - run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://www.pingloop.fr
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: placeholder

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (historique complet) car le serveur git de Gandi
      # rejette les push venant d'un clone superficiel ("shallow update
      # not allowed").
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gandi build lui-même l'appli côté serveur (npm install + next build) à
      # partir du code source poussé sur la branche `master` de son remote git
      # (nom imposé par leur script de déploiement, indépendant de notre `main`
      # GitHub). On ne lui envoie donc pas un build pré-compilé : le code source
      # tel quel, plus un `.env.production` généré depuis les secrets GitHub
      # (Gandi n'a pas d'interface de variables d'environnement pour ce type
      # d'instance). Ce fichier n'est ajouté que sur ce commit jetable, jamais
      # sur la branche `main` réelle du repo.
      - name: Write .env.production
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_BN_CODE=${{ secrets.PAYPAL_BN_CODE }}
          PAYPAL_ENV=${{ secrets.PAYPAL_ENV }}
          EOF

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GANDI_SSH_PRIVATE_KEY }}

      - name: Trust Gandi host key
        run: |
          HOST="$(echo "${{ vars.GANDI_GIT_REMOTE }}" | sed -E 's#.*@([^/]+)/.*#\1#')"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Push to Gandi
        run: |
          git config user.email "ci@pingloop.fr"
          git config user.name "GitHub Actions"
          git add -f .env.production
          git commit -q -m "Deploy ${{ github.sha }}"
          git remote add gandi "${{ vars.GANDI_GIT_REMOTE }}"
          git push -f gandi HEAD:master

      # `deploy` fait le build (npm install + next build) et le redémarrage de
      # l'appli côté Gandi.
      - name: Trigger Gandi deploy
        run: |
          REMOTE_USER_HOST="$(echo "${{ vars.GANDI_GIT_REMOTE }}" | sed -E 's#ssh\+git://([^/]+)/.*#\1#')"
          ssh "$REMOTE_USER_HOST" "deploy default.git"
